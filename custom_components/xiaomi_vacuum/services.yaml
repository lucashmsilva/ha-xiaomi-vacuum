clean_zone:
  target:
    entity:
      integration: xiaomi_vacuum
      domain: vacuum
  fields:
    zones:
      required: true
      example: "[[260, 250, 890, 750]]"
      selector:
        object:
    repeats:
      selector:
        number:
          min: 1
          max: 3
          mode: box

start_custom_cleaning:
  target:
    entity:
      integration: xiaomi_vacuum
      domain: vacuum
  fields:
    name:
      required: true
      example: "Afternoon cleaning"
      selector:
        select:
          options: []
          custom_value: true

clean_rooms:
  target:
    entity:
      integration: xiaomi_vacuum
      domain: vacuum
  fields:
    rooms:
      required: true
      example: >-
        [{"id": "6", "fan_level": "full_speed", "water_level": "level_3"},
        {"id": "4", "fan_level": "strong", "water_level": "level_2"}]
      selector:
        object:
